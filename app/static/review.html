<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识审核 · AIcare</title><script defer src="/static/admin.js?v=20261014-3"></script><script defer src="/static/ch09-dialog.js"></script><script defer src="/static/review.js?v=20261014"></script>
<link rel="stylesheet" href="/static/workspace.css?v=20261016">
</head>
<body class="admin-page review-page"><main><div class="page-head"><div><h1>知识审核</h1><p class="muted">先看原话与召回证据，再决定是否写回知识库。出现次数越多，越值得优先处理。</p></div><button id="refresh">刷新队列</button></div>
<details class="review-guidance"><summary>审核前，先确认这三件事</summary><section class="review-rules" aria-label="审核三道闸"><div><strong>过滤垃圾</strong><p>无关、恶意或没有实际需求的问题可驳回。</p></div><div><strong>核准时效</strong><p>价格、活动和临时承诺先核实；示例答案不能直接当政策。</p></div><div><strong>优先高频</strong><p>频次决定补知识的优先级，出现次数不代表答案可信。</p></div></section></details>
<div class="actions"><label for="status">审核状态</label><select id="status"><option>待审</option><option>通过</option><option>驳回</option><option value="全部">全部</option></select><button id="flywheel">整理问题池</button><span class="muted">运行标准化与同义查重，消耗少量模型 token。</span></div><p id="notice" class="notice" role="status"></p>
<div class="review-layout"><section class="panel"><div class="panel-head"><h2>知识缺口</h2><span id="count" class="muted"></span></div><div id="queue"></div></section><section class="panel review-detail"><h2>原话与证据</h2><div id="detail"><p class="muted empty-note">选择左侧一个缺口，查看它为什么被提出来。</p></div></section></div>
<section class="panel job-panel"><div class="panel-head"><h2>整理作业</h2><button id="stop-job" disabled>停止</button></div><p id="job-state" class="muted">尚未启动</p><pre id="job-log" class="log">作业日志将在这里显示。</pre></section>
</main><dialog id="approval"><form><h2>核准答案并写回知识库</h2><p id="approval-question"></p><label for="approved-answer">核准答案</label><textarea id="approved-answer" required maxlength="10000" placeholder="请填写已核实、可供客服引用的答案"></textarea><p class="muted">同步向量化成功后才记为通过。服务失败则保留待审，可核实后重试。</p><p id="approval-error" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel-approval">取消</button><button type="submit" class="primary" id="submit-approval">通过并写回</button></div></form></dialog></body></html>
